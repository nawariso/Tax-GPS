name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Python 3.12 quality gates
    runs-on: ubuntu-latest
    env:
      # Override the repository's developer default (.python-version) for this canonical CI job.
      UV_PYTHON: "3.12"
      # setup-python must provide the interpreter; uv must not silently download a substitute.
      UV_PYTHON_DOWNLOADS: "never"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --python 3.12

      - name: Verify Python 3.12 runtime
        run: |
          uv run --locked python -VV
          uv run --locked python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"

      - name: Lint
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Type check
        run: uv run --locked mypy --strict

      - name: Test with full branch coverage
        run: uv run --locked pytest --cov=tax_gps --cov-branch --cov-report=term-missing

      - name: Build distributions
        run: uv build
