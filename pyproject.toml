[project]
name = "tax-gps-core"
version = "0.1.0"
description = "Tax GPS deterministic Thai personal income tax core (TGPS-P1-001)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
# Runtime has no third-party dependencies by design (standard library only).
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tax_gps"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
markers = [
    "mandatory: TGPS-P1-001 section 12 mandatory acceptance tests",
    "golden: TGPS-P1-001 section 13 golden personas and fixtures",
    "negative: failure / unsupported / invalid-input tests",
    "replay: deterministic hash / replay tests",
    "boundary: PIT bracket boundary tests",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["tax_gps"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100
exclude_also = ["if TYPE_CHECKING:", "@overload", "raise AssertionError\\(\"unreachable"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "C4", "RUF", "PL", "PT", "T20", "DTZ", "S", "ANN", "FBT003", "PIE", "RET", "ARG"]
ignore = [
    "PLR2004", # magic values are expected in test assertions
    "PLR0913", # explicit value objects legitimately carry many fields
    "RUF001",  # Thai / typographic characters in documentation strings
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "PLR0915", "S603", "FBT003"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
warn_unreachable = true
